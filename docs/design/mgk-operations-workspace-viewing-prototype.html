<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MGK Operations Workspace — Viewing Prototype</title>
	<style>
		:root {
			--ink: #172033;
			--muted: #6b7280;
			--line: #e6e2da;
			--canvas: #f7f5f0;
			--surface: #ffffff;
			--surface-soft: #fbfaf7;
			--navy: #16243b;
			--navy-soft: #233653;
			--accent: #c64a31;
			--accent-soft: #fbece7;
			--green: #15805e;
			--green-soft: #e8f7f1;
			--amber: #a8640e;
			--amber-soft: #fff5df;
			--blue: #2869a7;
			--blue-soft: #eaf3fb;
			--purple: #6e57a5;
			--purple-soft: #f1edfb;
			--shadow: 0 14px 38px rgba(23, 32, 51, 0.08);
		}

		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body {
			margin: 0;
			background: var(--canvas);
			color: var(--ink);
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			font-size: 14px;
		}

		button, input, select, textarea { font: inherit; }
		button { cursor: pointer; }
		button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
			outline: 3px solid rgba(40, 105, 167, 0.28);
			outline-offset: 2px;
		}

		.app-shell { min-height: 100vh; }
		.topbar {
			position: sticky;
			top: 0;
			z-index: 50;
			display: flex;
			align-items: center;
			gap: 18px;
			height: 66px;
			padding: 0 32px;
			border-bottom: 1px solid rgba(230, 226, 218, 0.9);
			background: rgba(255, 255, 255, 0.94);
			backdrop-filter: blur(14px);
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 11px;
			border: 0;
			background: transparent;
			color: var(--ink);
			text-align: left;
		}

		.brand-mark {
			display: grid;
			place-items: center;
			width: 38px;
			height: 38px;
			border-radius: 11px;
			background: var(--navy);
			color: #fff;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 0.05em;
		}

		.brand strong { display: block; font-size: 14px; }
		.brand span { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }
		.topbar-divider { width: 1px; height: 28px; background: var(--line); }
		.topbar-title { min-width: 0; color: var(--muted); font-size: 13px; }
		.topbar-title strong { color: var(--ink); font-weight: 650; }
		.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
		.prototype-chip {
			padding: 5px 10px;
			border-radius: 999px;
			background: var(--amber-soft);
			color: var(--amber);
			font-size: 11px;
			font-weight: 750;
			letter-spacing: 0.03em;
		}
		.avatar {
			display: grid;
			place-items: center;
			width: 34px;
			height: 34px;
			border-radius: 50%;
			background: var(--navy);
			color: #fff;
			font-size: 11px;
			font-weight: 800;
		}

		.page {
			max-width: 1440px;
			margin: 0 auto;
			padding: 30px 32px 60px;
		}

		.breadcrumbs {
			display: flex;
			align-items: center;
			gap: 7px;
			min-height: 24px;
			margin-bottom: 16px;
			color: var(--muted);
			font-size: 12px;
		}

		.crumb-link {
			padding: 0;
			border: 0;
			background: transparent;
			color: var(--blue);
			font-weight: 650;
		}

		.page-heading {
			display: flex;
			align-items: flex-start;
			gap: 16px;
			margin-bottom: 24px;
		}

		.heading-copy { min-width: 0; }
		.eyebrow {
			margin-bottom: 7px;
			color: var(--accent);
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}
		h1, h2, h3, p { margin-top: 0; }
		h1 {
			margin-bottom: 8px;
			font-size: clamp(27px, 3vw, 40px);
			line-height: 1.08;
			letter-spacing: -0.035em;
		}
		.page-heading p { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
		.heading-actions { display: flex; gap: 8px; margin-left: auto; }

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			min-height: 39px;
			padding: 8px 14px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: var(--surface);
			color: var(--ink);
			font-weight: 700;
		}
		.btn:hover { border-color: #c9c4ba; background: var(--surface-soft); }
		.btn.primary { border-color: var(--navy); background: var(--navy); color: #fff; }
		.btn.primary:hover { background: var(--navy-soft); }
		.btn.success { border-color: var(--green); background: var(--green); color: #fff; }
		.btn.small { min-height: 32px; padding: 6px 10px; font-size: 11px; }
		.btn:disabled { cursor: not-allowed; opacity: 0.48; }

		.manage-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 15px;
		}
		.manage-card {
			padding: 20px;
			border: 1px solid var(--line);
			border-radius: 15px;
			background: var(--surface);
			box-shadow: 0 5px 20px rgba(23, 32, 51, 0.035);
		}
		.manage-icon { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 15px; border-radius: 11px; background: var(--blue-soft); color: var(--blue); font-size: 11px; font-weight: 850; }
		.manage-card h2 { margin-bottom: 7px; font-size: 17px; }
		.manage-card p { min-height: 42px; margin-bottom: 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
		.manage-card-footer { display: flex; align-items: center; gap: 8px; }
		.manage-count { margin-left: auto; color: var(--muted); font-size: 11px; }
		.manage-open { padding: 0; border: 0; background: transparent; color: var(--blue); font-size: 11px; font-weight: 800; }
		.manage-open:hover { text-decoration: underline; }
		.master-usage { display: flex; flex-wrap: wrap; gap: 6px; margin: -5px 0 16px; }
		.master-usage span { padding: 4px 7px; border-radius: 999px; background: var(--surface-soft); color: var(--muted); font-size: 9px; font-weight: 700; }
		.master-mobile-list { display: none; }
		.master-mobile-row { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
		.master-mobile-row strong { display: block; font-size: 12px; }
		.master-mobile-row span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.45; }
		.master-mobile-row .btn { margin-top: 10px; }

		.entry-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .55fr); gap: 16px; align-items: start; }
		.entry-layout > *, .form-section, .form-section-body { min-width: 0; }
		.form-section {
			margin-bottom: 15px;
			border: 1px solid var(--line);
			border-radius: 15px;
			background: var(--surface);
			overflow: hidden;
		}
		.form-section-head { display: flex; align-items: center; gap: 9px; padding: 14px 17px; border-bottom: 1px solid var(--line); background: var(--surface-soft); }
		.form-section-head h2 { margin: 0; font-size: 14px; }
		.form-section-head p { margin: 0 0 0 auto; color: var(--muted); font-size: 11px; }
		.form-section-body { padding: 17px; }
		.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
		.field-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.field { min-width: 0; }
		.field.full { grid-column: 1 / -1; }
		.field label { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; color: #4d5565; font-size: 11px; font-weight: 750; }
		.required { color: var(--accent); }
		.field input, .field select, .field textarea {
			width: 100%;
			min-height: 40px;
			padding: 9px 11px;
			border: 1px solid #d8d4cc;
			border-radius: 9px;
			background: #fff;
			color: var(--ink);
		}
		.field textarea { min-height: 78px; resize: vertical; }
		.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); outline: 3px solid rgba(40, 105, 167, .12); }
		.check-grid { display: flex; flex-wrap: wrap; gap: 10px; }
		.check-row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); color: var(--ink); font-size: 11px; font-weight: 700; }
		.check-row input { width: auto; min-height: auto; margin: 0; }
		.field-hint { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.4; }
		.field-with-action { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
		.field-with-action > select { min-width: 0; }
		.selected-summary { margin-top: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); }
		.selected-summary strong { display: block; font-size: 11px; }
		.selected-summary span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.45; }
		.entry-table-wrap { overflow-x: auto; }
		.entry-table { width: 100%; min-width: 720px; border-collapse: collapse; }
		.entry-table th { padding: 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9px; text-align: left; text-transform: uppercase; }
		.entry-table td { padding: 10px; vertical-align: top; }
		.entry-table input, .entry-table select { width: 100%; min-height: 38px; padding: 8px 9px; border: 1px solid #d8d4cc; border-radius: 8px; background: #fff; }
		.price-alert { display: flex; align-items: center; gap: 11px; margin-top: 12px; padding: 12px; border: 1px solid #edc36c; border-radius: 10px; background: var(--amber-soft); color: #77500c; }
		.price-alert.success { border-color: #93d4bd; background: var(--green-soft); color: var(--green); }
		.price-alert strong { display: block; font-size: 11px; }
		.price-alert small { display: block; margin-top: 3px; font-size: 10px; line-height: 1.4; }
		.price-alert .btn { margin-left: auto; flex: 0 0 auto; }
		.summary-stack { display: grid; gap: 10px; }
		.summary-row { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #efede8; }
		.summary-row:last-child { padding-bottom: 0; border-bottom: 0; }
		.summary-row span { color: var(--muted); font-size: 11px; }
		.summary-row strong { margin-left: auto; font-size: 12px; }
		.entry-actions { display: grid; gap: 8px; margin-top: 13px; }
		.flow-help { padding: 13px; border-radius: 10px; background: var(--blue-soft); color: #35516d; font-size: 10px; line-height: 1.55; }

		.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(13, 23, 39, .58); backdrop-filter: blur(4px); }
		.modal {
			width: min(760px, 100%);
			max-height: min(820px, calc(100vh - 38px));
			overflow: auto;
			border-radius: 17px;
			background: var(--surface);
			box-shadow: 0 26px 80px rgba(10, 20, 36, .34);
		}
		.modal.wide { width: min(920px, 100%); }
		.modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
		.modal-head h2 { margin-bottom: 4px; font-size: 19px; }
		.modal-head p { margin: 0; color: var(--muted); font-size: 11px; }
		.modal-close { margin-left: auto; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--muted); font-size: 18px; }
		.modal-body { padding: 20px; }
		.modal-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
		.modal-section:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
		.modal-section-title { margin-bottom: 12px; font-size: 13px; }
		.modal-footer { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: rgba(255,255,255,.97); }
		.workflow-box { padding: 22px; border: 1px solid #edc36c; border-radius: 12px; background: var(--amber-soft); text-align: center; }
		.workflow-box .status { margin-bottom: 12px; }
		.workflow-box h3 { margin-bottom: 7px; }
		.workflow-box p { max-width: 520px; margin: 0 auto; color: var(--muted); font-size: 11px; line-height: 1.55; }

		.hero {
			position: relative;
			overflow: hidden;
			display: grid;
			grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.75fr);
			gap: 22px;
			margin-bottom: 22px;
			padding: 30px;
			border-radius: 22px;
			background: var(--navy);
			color: #fff;
			box-shadow: var(--shadow);
		}

		.hero::after {
			content: "";
			position: absolute;
			right: -90px;
			top: -120px;
			width: 360px;
			height: 360px;
			border: 70px solid rgba(255, 255, 255, 0.035);
			border-radius: 50%;
		}

		.hero-copy, .hero-attention { position: relative; z-index: 1; }
		.hero h1 { max-width: 710px; margin-bottom: 12px; font-size: clamp(31px, 4vw, 50px); }
		.hero p { max-width: 670px; margin-bottom: 21px; color: #c6d1e2; font-size: 15px; line-height: 1.6; }
		.location-chip {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 7px 11px;
			border: 1px solid rgba(255, 255, 255, 0.13);
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.08);
			color: #eef3fb;
			font-size: 12px;
			font-weight: 650;
		}
		.location-dot { width: 8px; height: 8px; border-radius: 50%; background: #55d2a5; box-shadow: 0 0 0 4px rgba(85, 210, 165, 0.14); }
		.hero-attention {
			align-self: stretch;
			padding: 18px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 16px;
			background: rgba(255, 255, 255, 0.07);
		}
		.hero-attention h3 { margin-bottom: 12px; font-size: 13px; letter-spacing: 0.02em; }
		.attention-row {
			display: flex;
			align-items: center;
			gap: 10px;
			width: 100%;
			padding: 10px 0;
			border: 0;
			border-top: 1px solid rgba(255, 255, 255, 0.09);
			background: transparent;
			color: #fff;
			text-align: left;
		}
		.attention-row:first-of-type { border-top: 0; }
		.attention-row:hover strong { text-decoration: underline; }
		.attention-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: rgba(255, 255, 255, 0.1); font-size: 11px; font-weight: 800; }
		.attention-row strong { display: block; font-size: 12px; }
		.attention-row small { display: block; margin-top: 2px; color: #aebdd1; font-size: 11px; }
		.attention-arrow { margin-left: auto; color: #9fb0c8; }

		.section-head {
			display: flex;
			align-items: flex-end;
			gap: 12px;
			margin: 29px 0 14px;
		}
		.section-head h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
		.section-head p { margin: 0 0 1px; color: var(--muted); font-size: 12px; }

		.kpi-grid {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 13px;
		}
		.kpi {
			padding: 18px;
			border: 1px solid var(--line);
			border-radius: 14px;
			background: var(--surface);
			box-shadow: 0 3px 15px rgba(23, 32, 51, 0.035);
		}
		.kpi-label { color: var(--muted); font-size: 12px; font-weight: 650; }
		.kpi-value { margin-top: 7px; font-size: 28px; font-weight: 770; letter-spacing: -0.04em; }
		.kpi-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 11px; }
		.kpi-foot i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

		.flow-strip {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			gap: 0;
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 15px;
			background: var(--surface);
		}
		.flow-step {
			position: relative;
			min-height: 82px;
			padding: 15px 22px 14px 18px;
			border: 0;
			border-right: 1px solid var(--line);
			background: transparent;
			color: var(--ink);
			text-align: left;
		}
		.flow-step:last-child { border-right: 0; }
		.flow-step:hover { background: var(--surface-soft); }
		.flow-step::after {
			content: "›";
			position: absolute;
			right: 7px;
			top: 29px;
			color: #b9b5ad;
			font-size: 18px;
		}
		.flow-step:last-child::after { display: none; }
		.flow-number { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; }
		.flow-step strong { display: block; margin-top: 5px; font-size: 13px; }
		.flow-step small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }

		.book-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 16px;
		}
		.group-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 16px;
		}
		.group-card {
			min-height: 238px;
			padding: 20px;
			border: 1px solid #d9d4ca;
			border-radius: 18px;
			background: var(--surface);
			color: var(--ink);
			text-align: left;
			box-shadow: 0 5px 20px rgba(23, 32, 51, 0.035);
			transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
		}
		.group-card:hover { transform: translateY(-4px); border-color: #bdb5a8; box-shadow: var(--shadow); }
		.group-top { display: flex; align-items: flex-start; gap: 12px; }
		.group-code {
			display: grid;
			place-items: center;
			width: 44px;
			height: 44px;
			border-radius: 11px;
			color: #fff;
			font-size: 10px;
			font-weight: 850;
			letter-spacing: 0.04em;
		}
		.group-copy { min-width: 0; }
		.group-copy strong { display: block; font-size: 16px; }
		.group-copy small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
		.book-shelf {
			display: flex;
			align-items: flex-end;
			gap: 7px;
			height: 103px;
			margin-top: 17px;
			padding: 12px 13px 9px;
			border: 8px solid #65452f;
			border-top-width: 5px;
			border-radius: 5px;
			background: #e6d2b7;
			box-shadow: inset 0 -8px 0 #8b6547, 0 4px 0 #4f3628;
		}
		.mini-book {
			display: flex;
			align-items: center;
			justify-content: center;
			width: min(52px, 22%);
			height: 67px;
			padding: 4px;
			border-radius: 3px 6px 2px 2px;
			color: #fff;
			box-shadow: inset 5px 0 rgba(0,0,0,.14);
			font-size: 8px;
			font-weight: 850;
			line-height: 1.15;
			text-align: center;
		}
		.group-open { display: block; margin-top: 16px; color: var(--blue); font-size: 12px; font-weight: 800; }
		.book-group-intro {
			margin-bottom: 18px;
			padding: 15px 17px;
			border: 1px solid var(--line);
			border-radius: 13px;
			background: var(--surface);
			color: var(--muted);
			font-size: 12px;
			line-height: 1.55;
		}
		.book-card {
			position: relative;
			overflow: hidden;
			min-height: 290px;
			padding: 0;
			border: 0;
			border-radius: 17px;
			background: transparent;
			color: var(--ink);
			text-align: left;
			transition: transform 160ms ease, box-shadow 160ms ease;
		}
		.book-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
		.book-cover {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 220px;
			padding: 19px 17px 17px 26px;
			border-radius: 16px 16px 7px 7px;
			color: #fff;
			box-shadow: inset 9px 0 0 rgba(0, 0, 0, 0.16), inset 11px 0 0 rgba(255, 255, 255, 0.1);
		}
		.book-cover::before {
			content: "";
			position: absolute;
			inset: 0;
			background-image: radial-gradient(circle at 8px 8px, rgba(255,255,255,.1) 2px, transparent 2.5px);
			background-size: 16px 16px;
			mix-blend-mode: screen;

		function esc(value) {
			return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
		}

		function slug(value) {

		function itemInfo(name) { return demoState.items.find(item => item.name === name) || null; }
		function warehouseInfo(name) { return demoState.warehouses.find(warehouse => warehouse.name === name) || null; }

		function renderPurchaseOrderEntry(bookKey) {

			syncDraftPrice();

			const supplier = supplierInfo(draft.supplier);
			const agent = agentInfo(draft.agent);
			const price = approvedPrice(draft.item, draft.supplier);
			const subtotal = Number(draft.qty || 0) * Number(draft.rate || 0);
			const taxAmount = draft.tax.includes("5") ? subtotal * .05 : 0;
			const grandTotal = subtotal + taxAmount;
			const supplierOptions = [`<option value="">Choose supplier</option>`, ...demoState.suppliers.map(row => `<option value="${esc(row.name)}"${row.name === draft.supplier ? " selected" : ""}>${esc(row.name)}</option>`)].join("");

			const itemOptions = demoState.items.map(row => `<option value="${esc(row.name)}"${row.name === draft.item ? " selected" : ""}>${esc(row.name)}</option>`).join("");
			const warehouseOptions = demoState.warehouses.map(row => `<option value="${esc(row.name)}"${row.name === draft.warehouse ? " selected" : ""}>${esc(row.name)}${row.supplier ? ` · ${esc(row.supplier)}` : ""}</option>`).join("");

				? `<div class="price-alert"><div><strong>Select a Supplier first</strong><small>Item Price is supplier-specific. Choose or create the supplier before validating the rate.</small></div></div>`

					? `<div class="price-alert success"><div><strong>Approved Item Price applied automatically</strong><small>${esc(price.item)} · ${esc(price.supplier)} · ${formatMoney(price.rate)} / ${esc(price.uom)} · ${esc(price.tax)}</small></div><button class="btn small" type="button" data-open-modal="price">View Price</button></div>`

			return `<div class="page">
				${breadcrumbs([{ label: "All Books", route: "home" }, { label: module.label, route: moduleRoute("po") }, { label: book.label, route: bookRoute("po", bookKey) }, { label: "New Entry" }])}

							<div class="field-grid three">
								<div class="field full"><label>Supplier <span class="required">*</span></label><div class="field-with-action"><select data-po-field="supplier">${supplierOptions}</select><button class="btn small" type="button" data-open-modal="supplier">+ New Supplier & Address</button></div>
									${supplier ? `<div class="selected-summary"><strong>${esc(supplier.name)}</strong><span>${esc([supplier.address1, supplier.address2, supplier.city, supplier.state, supplier.pincode].filter(Boolean).join(", "))}<br>${esc(supplier.gstin || "GSTIN not entered")} · ${esc(supplier.phone || "Phone not entered")}</span><button class="btn small" type="button" data-open-modal="supplier" data-edit-supplier="${esc(supplier.name)}" style="margin-top:9px">Edit Supplier / Address</button></div>` : `<span class="field-hint">Create a Supplier and its Address from the same popup.</span>`}

								<div class="field"><label>Expected Delivery</label><input type="date" value="${esc(draft.deliveryDate)}" data-po-field="deliveryDate"></div>

							</tr></tbody></table></div>
							${pricePanel}
						</div></section>
					</div>
					<aside>

				</div>
			</div>`;

		function findRecord(key, id) {
			return MODULES[key]?.records.find(record => record.id === id) || null;
		}

		function journeyFor(key, record) {
			return MODULE_ORDER.map(stepKey => {
				const module = MODULES[stepKey];
				const isCurrent = stepKey === key;
				const linked = record.links.find(link => link.module === stepKey);
				const stepId = isCurrent ? record.id : linked?.id;
				const classes = isCurrent ? "current" : linked ? "linked" : "";
				const button = stepId ? `<button type="button" data-route="${recordRoute(stepKey, stepId)}">${esc(module.code)} · ${esc(module.short)}</button>` : `<button type="button" disabled>${esc(module.code)} · ${esc(module.short)}</button>`;
				return `<div class="journey-step ${classes}"><span class="journey-dot">${isCurrent ? "NOW" : linked ? "✓" : "·"}</span><div>${button}<small>${stepId ? esc(stepId) : "No linked record"}</small></div></div>`;
			}).join("");
		}

		function renderDetail(key, id) {
			const module = MODULES[key];
			const record = findRecord(key, id);
			if (!module || !record) return renderNotFound();
			const book = bookInfo(key, record.book);
			setTopbar(`${module.code} · ${record.id}`);
			const lineHeaders = key === "ipd" ? ["Sequence", "Process", "Input", "Output", "Control"] : ["Count / Item", "Description", "Packing / Detail", "Quantity", "Result / Amount"];
			const related = record.links.length ? record.links.map(link => {
				const target = MODULES[link.module];
				return `<button class="related-card" type="button" data-route="${recordRoute(link.module, link.id)}"><span class="related-code ${target.coverClass}">${target.code}</span><span><strong>${esc(link.id)}</strong><small>${esc(link.label)}</small></span><span>›</span></button>`;

			const attachments = record.attachments.length ? record.attachments.map(file => `<div class="attachment"><span class="file-icon">FILE</span><span><strong>${esc(file[0])}</strong><small>${esc(file[1])}</small></span><button class="view-tag" type="button" data-preview-file="${esc(file[0])}" style="border:0;background:transparent">Preview</button></div>`).join("") : `<div style="color:var(--muted);font-size:11px">No attachments in this sample.</div>`;
			return `<div class="page">
				${breadcrumbs([{ label: "All Books", route: "home" }, { label: module.label, route: moduleRoute(key) }, { label: book.label, route: bookRoute(key, book.key) }, { label: record.id }])}

					</div>

						<section class="section-card"><div class="card-head"><h2>Connected records</h2></div><div class="section-body"><div class="related-stack">${related}</div></div></section>

						<button class="btn" type="button" data-route="${bookRoute(key, book.key)}" style="width:100%">← Back to ${esc(book.label)}</button>

		function renderNotFound() {
			setTopbar("Not found");
			return `<div class="page">${breadcrumbs([{ label: "All Books", route: "home" }, { label: "Not found" }])}<div class="section-card"><div class="section-body" style="padding:50px;text-align:center"><h1 style="font-size:26px">This sample page was not found.</h1><p style="color:var(--muted)">Return to the book groups and choose another book.</p><button class="btn primary" type="button" data-route="home">Go to All Books</button></div></div></div>`;
		}

		function parseRoute() {
			const raw = window.location.hash.replace(/^#\/?/, "") || "home";
			return raw.split("/").filter(Boolean).map(decodeURIComponent);
		}

		function render() {
			const parts = parseRoute();
			let html;
			if (parts[0] === "home") html = renderHome();
			else if (parts[0] === "manage" && parts[1]) html = renderMasterList(parts[1]);
			else if (parts[0] === "manage") html = renderManage();
			else if (parts[0] === "group" && parts[1]) html = renderBookGroup(parts[1]);
			else if (parts[0] === "list" && parts[1] && parts[2]) html = renderList(parts[1], parts[2]);
			else if (parts[0] === "entry" && parts[1] === "po" && parts[2]) html = renderPurchaseOrderEntry(parts[2]);
			else if (parts[0] === "detail" && parts[1] && parts[2]) html = renderDetail(parts[1], parts[2]);
			else html = renderNotFound();
			document.getElementById("app").innerHTML = html;
			window.scrollTo({ top: 0, behavior: "instant" });
			if (parts[0] === "list" && MODULES[parts[1]] && bookInfo(parts[1], parts[2])) {
				const input = document.getElementById("list-search");
				if (input) input.addEventListener("input", event => {
					state.filters[`${parts[1]}:${parts[2]}`].search = event.target.value;
					applyListFilter(parts[1], parts[2]);
				});
				applyListFilter(parts[1], parts[2]);
			}
		}

		function applyListFilter(key, bookKey) {
			const filter = state.filters[`${key}:${bookKey}`];
			const search = filter.search.trim().toLowerCase();
			const candidates = [...document.querySelectorAll("[data-record-route]")];
			let visibleDesktop = 0;
			for (const node of candidates) {
				const visible = (!search || node.dataset.search.includes(search)) && (filter.status === "All" || node.dataset.status === filter.status);
				node.hidden = !visible;
				if (visible && node.tagName === "TR") visibleDesktop += 1;
			}
			const count = document.getElementById("list-count");
			const total = MODULES[key].records.filter(record => record.book === bookKey).length;
			if (count) count.textContent = `${visibleDesktop} of ${total} records`;
			const empty = document.getElementById("list-empty");
			if (empty) empty.hidden = visibleDesktop !== 0;
		}

		function showToast(message) {
			const root = document.getElementById("toast-root");
			root.innerHTML = `<div class="toast">${esc(message)}</div>`;
			window.clearTimeout(showToast.timer);
			showToast.timer = window.setTimeout(() => { root.innerHTML = ""; }, 2600);
		}

		document.addEventListener("click", event => {
			const routeTarget = event.target.closest("[data-route]");
			if (routeTarget && !routeTarget.disabled) {
				closeModal();
				route(routeTarget.dataset.route);
				return;
			}
			const row = event.target.closest("[data-record-route]");
			if (row) {
				route(row.dataset.recordRoute);
				return;
			}
			const status = event.target.closest("[data-status-filter]");
			if (status) {
				const parts = parseRoute();
				const key = parts[1];
				const bookKey = parts[2];
				state.filters[`${key}:${bookKey}`].status = status.dataset.statusFilter;
				render();
				return;
			}
			if (event.target.closest("[data-close-modal]") || event.target.matches("[data-modal-backdrop]")) {
				closeModal();
				return;
			}
			const modalButton = event.target.closest("[data-open-modal]");
			if (modalButton) {
				const editName = modalButton.dataset.editName || "";
				if (modalButton.dataset.openModal === "supplier") openSupplierModal(editName || modalButton.dataset.editSupplier || "");
				if (modalButton.dataset.openModal === "agent") openAgentModal(editName || modalButton.dataset.editAgent || "");
				if (modalButton.dataset.openModal === "item") openItemModal(editName);
				if (modalButton.dataset.openModal === "warehouse") openWarehouseModal(editName);
				if (modalButton.dataset.openModal === "process-cost") openProcessCostModal(editName);
				if (modalButton.dataset.openModal === "user") openUserModal(editName);
				if (modalButton.dataset.openModal === "price") {
					if (modalButton.dataset.priceItem) {
						demoState.poDraft.item = modalButton.dataset.priceItem;
						demoState.poDraft.supplier = modalButton.dataset.priceSupplier || "";
					} else if (modalButton.hasAttribute("data-create-master") && parseRoute()[0] === "manage") {
						demoState.poDraft.item = demoState.items[0]?.name || "";
						demoState.poDraft.supplier = "";
					}
					openPriceModal(false);
				}
				return;
			}
			const saveSupplier = event.target.closest("[data-save-supplier]");
			if (saveSupplier) {
				const name = modalFieldValue("supplier-name");
				const address1 = modalFieldValue("supplier-address1");
				const city = modalFieldValue("supplier-city");
				const pincode = modalFieldValue("supplier-pincode");
				if (!name || !address1 || !city || !pincode) {
					showToast("Supplier Name, Address Line 1, City and Pincode are required.");
					return;
				}
				const original = saveSupplier.dataset.originalName;
				const record = {
					name, gstin: modalFieldValue("supplier-gstin"), pan: modalFieldValue("supplier-pan"),
					address1, address2: modalFieldValue("supplier-address2"), city,
					state: modalFieldValue("supplier-state"), pincode, phone: modalFieldValue("supplier-phone"),
				};
				const index = demoState.suppliers.findIndex(row => row.name === original);
				if (index >= 0) demoState.suppliers[index] = record;
				else demoState.suppliers.push(record);
				if (parseRoute()[0] === "entry") demoState.poDraft.supplier = name;
				closeModal();
				render();
				showToast(`${name} and its primary Address are ready to use.`);
				return;
			}
			const saveAgent = event.target.closest("[data-save-agent]");
			if (saveAgent) {
				const name = modalFieldValue("agent-name");
				if (!name) { showToast("Agent Name is required."); return; }
				const record = { name, terms: modalFieldValue("agent-terms") };
				const index = demoState.agents.findIndex(row => row.name === saveAgent.dataset.originalName);
				if (index >= 0) demoState.agents[index] = record;
				else demoState.agents.push(record);
				if (parseRoute()[0] === "entry") demoState.poDraft.agent = name;
				closeModal();
				render();
				showToast(`${name} is ready to select.`);
				return;
			}
			const saveItem = event.target.closest("[data-save-item]");
			if (saveItem) {
				const name = modalFieldValue("item-name");
				const itemGroup = modalFieldValue("item-group");
				const uom = modalFieldValue("item-uom");
				if (!name || !itemGroup || !uom) { showToast("Item Name, Item Group and Default UOM are required."); return; }
				const original = saveItem.dataset.originalName;
				const record = { name, itemGroup, uom, hsn: modalFieldValue("item-hsn"), brand: modalFieldValue("item-brand"), isStock: document.getElementById("item-stock").checked, isPurchase: document.getElementById("item-purchase").checked, status: "Active" };
				const index = demoState.items.findIndex(row => row.name === original);
				if (index >= 0) demoState.items[index] = record;
				else demoState.items.push(record);
				if (original && original !== name) {
					demoState.prices.forEach(row => { if (row.item === original) row.item = name; });
					demoState.processCosts.forEach(row => { if (row.item === original) row.item = name; });
				}
				if (parseRoute()[0] === "entry" || demoState.poDraft.item === original) demoState.poDraft.item = name;
				syncDraftPrice();
				closeModal(); render(); showToast(`${name} is ready to use.`);
				return;
			}
			const saveWarehouse = event.target.closest("[data-save-warehouse]");
			if (saveWarehouse) {
				const name = modalFieldValue("warehouse-name");
				if (!name) { showToast("Warehouse Name is required."); return; }
				const original = saveWarehouse.dataset.originalName;
				const record = { name, supplier: modalFieldValue("warehouse-supplier"), status: document.getElementById("warehouse-disabled").checked ? "Disabled" : "Active" };
				const index = demoState.warehouses.findIndex(row => row.name === original);
				if (index >= 0) demoState.warehouses[index] = record;
				else demoState.warehouses.push(record);
				if (parseRoute()[0] === "entry" || demoState.poDraft.warehouse === original) demoState.poDraft.warehouse = name;
				closeModal(); render(); showToast(`${name} is ready to select.`);
				return;
			}
			const saveProcessCost = event.target.closest("[data-save-process-cost]");
			if (saveProcessCost) {
				const process = modalFieldValue("process-cost-process");
				const item = modalFieldValue("process-cost-item");
				const supplier = modalFieldValue("process-cost-supplier");
				const rate = Number(modalFieldValue("process-cost-rate"));
				if (!process || !item || !supplier || !(rate > 0)) { showToast("Process, Item, Supplier and a Cost greater than zero are required."); return; }
				const original = saveProcessCost.dataset.originalName;
				const name = original || `PC-2026-${String(demoState.processCosts.length + 19).padStart(5, "0")}`;
				const record = { name, process, item, supplier, uom: modalFieldValue("process-cost-uom"), fromDate: modalFieldValue("process-cost-from-date"), tax: modalFieldValue("process-cost-tax"), moq: Number(modalFieldValue("process-cost-moq") || 0), rate, status: original ? (processCostInfo(original)?.status || "Draft") : "Draft" };
				const index = demoState.processCosts.findIndex(row => row.name === original);
				if (index >= 0) demoState.processCosts[index] = record;
				else demoState.processCosts.push(record);
				closeModal(); render(); showToast(`${name} was saved.`);
				return;
			}
			const saveUser = event.target.closest("[data-save-user]");
			if (saveUser) {
				const email = modalFieldValue("user-email");
				const firstName = modalFieldValue("user-first-name");
				const roles = [...document.querySelectorAll("[data-user-role]:checked")].map(node => node.value);
				const suppliers = [...document.querySelectorAll("[data-user-supplier]:checked")].map(node => node.value);
				const warehouses = [...document.querySelectorAll("[data-user-warehouse]:checked")].map(node => node.value);
				if (!email || !firstName || !roles.length) { showToast("Email, First Name and at least one Role are required."); return; }
				const original = saveUser.dataset.originalName;
				const record = { email, firstName, mobile: modalFieldValue("user-mobile"), roles, roleProfile: modalFieldValue("user-role-profile"), suppliers, warehouses, uiLayout: modalFieldValue("user-ui-layout"), enabled: document.getElementById("user-enabled").checked };
				const index = demoState.users.findIndex(row => row.email === original);
				if (index >= 0) demoState.users[index] = record;
				else demoState.users.push(record);
				const welcome = document.getElementById("user-welcome-email").checked && !original;
				closeModal(); render(); showToast(`${email} and its access settings were saved${welcome ? "; welcome email queued" : ""}.`);
				return;
			}
			if (event.target.closest("[data-save-price]")) {
				const item = modalFieldValue("price-item");
				const supplier = modalFieldValue("price-supplier");
				const rate = Number(modalFieldValue("price-rate"));
				if (!item || !supplier || !(rate > 0)) { showToast("Item, Supplier and a Price greater than zero are required."); return; }
				demoState.pendingPrice = {
					item, supplier, uom: modalFieldValue("price-uom"), fromDate: modalFieldValue("price-from-date"),
					toDate: modalFieldValue("price-to-date"), tax: modalFieldValue("price-tax"), moq: Number(modalFieldValue("price-moq") || 0),
					rate, leadTime: Number(modalFieldValue("price-lead-time") || 0), status: "Approval Pending",
				};
				openPriceModal(true);
				showToast("Item Price saved and submitted for approval.");
				return;
			}
			if (event.target.closest("[data-approve-price]")) {
				const price = { ...demoState.pendingPrice, status: "Approved" };
				demoState.prices = demoState.prices.filter(row => !(row.item === price.item && row.supplier === price.supplier));
				demoState.prices.push(price);
				demoState.pendingPrice = null;
				syncDraftPrice();
				closeModal();
				render();
				showToast(`Approved price ${formatMoney(price.rate)} applied to the Purchase Order.`);
				return;
			}
			if (event.target.closest("[data-po-save]")) {
				showToast("Purchase Order draft saved in this prototype.");
				return;
			}
			if (event.target.closest("[data-po-submit]")) {
				if (!approvedPrice(demoState.poDraft.item, demoState.poDraft.supplier)) {
					showToast("Approve the Item Price before submitting this Purchase Order.");
					return;
				}
				showToast("Purchase Order submitted. The server will validate permissions and Item Price again.");
				return;
			}
			const file = event.target.closest("[data-preview-file]");
			if (file) showToast(`${file.dataset.previewFile} would open here in the real UI.`);
		});

		document.addEventListener("change", event => {
			const field = event.target.closest("[data-po-field]");
			if (!field) return;
			const key = field.dataset.poField;
			demoState.poDraft[key] = key === "qty" ? Number(field.value || 0) : field.value;
			if (key === "supplier" || key === "item") syncDraftPrice();
			render();
		});

		document.addEventListener("keydown", event => {
			if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-record-route]")) {
				event.preventDefault();
				route(event.target.dataset.recordRoute);
			}
		});

		window.addEventListener("hashchange", render);
		if (!window.location.hash) window.location.hash = "home";
		else render();
	</script>
</body>
</html>
